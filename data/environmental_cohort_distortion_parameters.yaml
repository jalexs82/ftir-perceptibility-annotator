process_notes:
  overview: |-
    This configuration defines empirical and electrodynamic parameter distributions calibrated from
    authentic microplastic particles and substrate backgrounds for autoLUMOS pipelines. It establishes
    reproducible forward-physics parameters (Beer-Lambert optical saturation, resonant Mie scattering,
    Kramers-Kronig anomalous dispersion, active-mask pink instrument noise) and calibrates
    operational confidence gates for automated microplastic classification.
  standardized_grid: |-
    All FTIR spectra are standardized onto a high-resolution 702-channel grid spanning 4000.0 cm^-1
    to 1196.0 cm^-1 at uniform 4.0 cm^-1 decrements. Standardizing across this standardized grid
    ensures exact dimensional and feature compatibility with the pre-trained PyTorch 1D-CNN feature
    extractor (similarity_model_pytorch.pt) and the Open-Set Support Vector Classifier.
  annular_subtraction_and_clipping: |-
    Unlike legacy artificial channel-zeroing or opaque filter masks, spectral attenuation and clipping
    are modeled organically via non-negative annular background subtraction:
        S_sub(nu) = max(0.0, S_raw(nu) - S_annular(nu))
    where S_annular is drawn directly from localized annular substrate regions (silt, clay, mineral,
    and organic filter matrix). When background absorbance meets or exceeds particle signal, the difference
    smoothly flatlines to zero (zeta_zero), naturally capturing substrate obscuration while preserving
    authentic polymer peak line shapes in unoccluded spectral windows.
  physical_inversion_protocol: |-
    Seven electrodynamic physical components are inverted from each particle-background pair:
    1. Optical Thickness (tau): Inverted via non-negative least squares (NNLS) fitting against clean polymer
       reference templates: min_tau ||S_sub - tau * S_clean||^2, modeling Beer-Lambert non-linear saturation.
    2. Resonant Mie Scattering (rho_0): Scaled amplitude of anomalous dispersion swings governed by
       van de Hulst anomalous diffraction Q_ext(rho) and Kramers-Kronig refractive index shifts delta_n(nu).
    3. Signal-to-Noise Ratio (SNR): Robust active-mask noise estimate using Median Absolute Deviation (MAD)
       of first-order spectral differences across non-zero channels:
           sigma_noise = 1.4826 * MAD(diff(S_active)) / sqrt(2); SNR = max(S_sub) / sigma_noise.
    4. Background-to-Signal Ratio (BSR): Ratio of peak annular background absorbance to peak subtracted
       particle absorbance: max(S_annular) / max(S_sub).
    5. Substrate Contrast Ratio (SCR): RMS ratio of subtracted particle signal to background:
       RMS(S_sub) / RMS(S_annular).
    6. Flatline Zero Fraction (zeta_zero): Proportion of spectral channels where S_sub <= 1e-4 due to
       complete substrate obscuration.
    7. Baseline Slope (slope): Dimensionless baseline tilt between high-frequency transparent baseline
       (3600-3850 cm^-1) and mid-frequency window (2500-2700 cm^-1).
  composite_distortion_index: |-
    The Annular-Aware Composite Distortion Index (D_composite) aggregates all five major degradation axes:
        D_composite = 0.25 * norm(inv_SNR) + 0.25 * norm(rho_0) + 0.20 * norm(BSR)
                    + 0.20 * norm(zeta_zero) + 0.10 * norm(|slope|)
    where each component is normalized against its 90th percentile environmental degradation scale.
    Higher D_composite indicates severe particulate occlusion, Mie distortion, or low SNR.
  operational_triage_gates: |-
    Operational triage boundaries calibrated against downstream open-set classifier breakdown:
    - 90% High-Confidence Acceptance Gate (D_composite <= 0.063, SNR >= 3.0-5.0, rho_0 <= 0.65-1.40):
      Particles meeting these criteria retain key diagnostic fingerprint peaks and can be reliably
      classified by automated pipelines without human review.
    - 50% Critical Breakdown Limit (D_composite >= 0.085):
      Particles exceeding this distortion index exhibit catastrophic spectral loss or Mie phase
      reversal, collapsing classification accuracy below 50% and triggering automated flagging for manual review.
